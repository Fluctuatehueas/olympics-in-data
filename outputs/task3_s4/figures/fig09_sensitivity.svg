<rect x="832" y="90" width="10" height="10" rx="2" fill="#1F6FEB"/>
<text x="848" y="99" font-size="11.5" fill="#1F2933">大团人效</text>
<line x1="64" y1="245" x2="896" y2="245" stroke="#E5E7EB"/>
<text x="24" y="276" font-size="11" fill="#6B7280">小项口径 → 运动员行口径（1980+ 有奖牌届次）</text>
<rect x="124" y="355.3" width="90" height="44.7" fill="#D1495B" rx="2"/>
<text x="169.0" y="349.3" font-size="11" text-anchor="middle" fill="#1F2933">0.0732</text>
<text x="169.0" y="418" font-size="10.5" text-anchor="middle" fill="#6B7280">小项·小团</text>
<rect x="274" y="359.8" width="90" height="40.2" fill="#1F6FEB" rx="2"/>
<text x="319.0" y="353.8" font-size="11" text-anchor="middle" fill="#1F2933">0.0658</text>
<text x="319.0" y="418" font-size="10.5" text-anchor="middle" fill="#6B7280">小项·大团</text>
<rect x="424" y="342.7" width="90" height="57.3" fill="#D1495B" rx="2"/>
<text x="469.0" y="336.7" font-size="11" text-anchor="middle" fill="#1F2933">0.0938</text>
<text x="469.0" y="418" font-size="10.5" text-anchor="middle" fill="#6B7280">行口径·小团</text>
<rect x="574" y="311.1" width="90" height="88.9" fill="#1F6FEB" rx="2"/>
<text x="619.0" y="305.1" font-size="11" text-anchor="middle" fill="#1F2933">0.1455</text>
<text x="619.0" y="418" font-size="10.5" text-anchor="middle" fill="#6B7280">行口径·大团</text>
<text x="24" y="426" font-size="11" fill="#D1495B">小项口径下小团更高（0.0732 &gt; 0.0658）；换行口径后大团更高（0.1455 &gt; 0.0938）——方向相反。</text>
<text x="24" y="450" font-size="10.5" fill="#6B7280">这个翻转不是测量误差：团体项目在行口径下给大团额外加成，而小团的奖牌多来自个人项目。结论必须绑定口径才有意义。</text>
</svg>