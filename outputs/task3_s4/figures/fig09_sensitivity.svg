<circle cx="760.0" cy="179.5" r="4" fill="#D1495B"/>
<polyline points="104.0,179.1 268.0,179.8 432.0,179.3 596.0,177.8 760.0,174.1" fill="none" stroke="#1F6FEB" stroke-width="2.2"/>
<circle cx="104.0" cy="179.1" r="4" fill="#1F6FEB"/>
<circle cx="268.0" cy="179.8" r="4" fill="#1F6FEB"/>
