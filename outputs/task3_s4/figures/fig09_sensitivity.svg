<text x="56" y="74.0" font-size="10" text-anchor="end" fill="#6B7280">0.23</text>
<text x="24" y="56" font-size="11" fill="#6B7280">人效中位数</text>
<polyline points="104.0,111.4 268.0,137.3 432.0,169.5 596.0,176.2 760.0,179.5" fill="none" stroke="#D1495B" stroke-width="2.2"/>
<circle cx="104.0" cy="111.4" r="4" fill="#D1495B"/>
